name: CDN Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      UPLOAD_TICKET_SECRET: ${{ secrets.UPLOAD_TICKET_SECRET }}
      CRON_JOBS_API_KEY: ${{ secrets.CRON_JOBS_API_KEY }}
      VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: production
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/cdn.karasu256.com
          secrets-command: node .github/scripts/worker-secrets-file.mjs {app_path} "{secrets_file}" {secret_names}
          secret-names: UPLOAD_TICKET_SECRET CRON_JOBS_API_KEY VERCEL_PROTECTION_BYPASS_SECRET
          deploy-command: pnpm --filter cdn.karasu256.com deploy
          preview-command: pnpm --filter cdn.karasu256.com preview -- --name "{branch}" --secrets-file "{secrets_file}"
          sync-command: pnpm --filter cdn.karasu256.com exec wrangler secret bulk "{secrets_file}" --env production
          worker-name: cdn-karasu256-com

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      UPLOAD_TICKET_SECRET: ${{ secrets.UPLOAD_TICKET_SECRET }}
      CRON_JOBS_API_KEY: ${{ secrets.CRON_JOBS_API_KEY }}
      VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/Workers/deploy-worker@v1
        with:
          mode: preview
          hub-repo: Karasu-Lab/Karasu-Lab
          app-path: apps/cdn.karasu256.com
          secrets-command: node .github/scripts/worker-secrets-file.mjs {app_path} "{secrets_file}" {secret_names}
          secret-names: UPLOAD_TICKET_SECRET CRON_JOBS_API_KEY VERCEL_PROTECTION_BYPASS_SECRET
          deploy-command: pnpm --filter cdn.karasu256.com deploy
          preview-command: pnpm --filter cdn.karasu256.com preview -- --name "{branch}" --secrets-file "{secrets_file}"
          sync-command: pnpm --filter cdn.karasu256.com exec wrangler secret bulk "{secrets_file}" --env production
          worker-name: cdn-karasu256-com
