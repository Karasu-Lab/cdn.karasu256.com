name = "cdn-karasu256-com"
main = "src/index.ts"
compatibility_date = "2025-06-24"

routes = [{ pattern = "cdn.karasu256.com", custom_domain = true }]

[[r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "cdn"

[[kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "dda7387a349f4de3b1698f20e713294d"

[vars]
APP_ENV = "production"

[env.local]
name = "cdn-karasu256-com"
routes = []

[[env.local.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "cdn-local"

[[env.local.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "local-rate-limit-kv"

[env.local.vars]
APP_ENV = "local"
UPLOAD_TICKET_SECRET = "local-development-upload-ticket-secret"
CRON_JOBS_API_KEY = "local-development-cron-jobs-api-key"

[env.preview]
name = "cdn-karasu256-com"

[[env.preview.routes]]
pattern = "dev.cdn.karasu256.com"
custom_domain = true

[[env.preview.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "cdn"
remote = true

[[env.preview.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "c3fb9b94d2074304986c58049620d0b4"
remote = true

[env.preview.vars]
APP_ENV = "preview"

[observability.logs]
enabled = true
invocation_logs = false

[previews.vars]
APP_ENV = "preview"

[[previews.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "cdn"

[[previews.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "c3fb9b94d2074304986c58049620d0b4"
