name = "cdn-karasu256-com"
main = "src/index.ts"
compatibility_date = "2025-06-24"

[env.production]
name = "cdn-karasu256-com"

[[env.production.routes]]
pattern = "cdn.karasu256.com"
custom_domain = true

[[env.production.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "karasu-lab-cdn"

# Created via `wrangler kv namespace create CLOUDFLARE_RATE_LIMIT_KV`.
[[env.production.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "dda7387a349f4de3b1698f20e713294d"

[env.production.vars]
APP_ENV = "production"

[env.dev]
name = "cdn-karasu256-com"
routes = []

[[env.dev.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "karasu-lab-cdn-dev"
remote = true

# Created via `wrangler kv namespace create CLOUDFLARE_RATE_LIMIT_KV --env dev`; replace
# the id below with the value that command prints.
[[env.dev.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "c3fb9b94d2074304986c58049620d0b4"
remote = true

[env.dev.vars]
APP_ENV = "local"

[env.local]
name = "cdn-karasu256-com"
routes = []

[[env.local.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "karasu-lab-cdn-local"

[[env.local.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "local-rate-limit-kv"

[env.local.vars]
APP_ENV = "local"
UPLOAD_TICKET_SECRET = "local-development-upload-ticket-secret"
CRON_JOBS_API_KEY = "local-development-cron-jobs-api-key"

[env.preview]
name = "cdn-karasu256-com"

[[env.preview.routes]]
pattern = "dev.cdn.karasu256.com"
custom_domain = true

[[env.preview.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "karasu-lab-cdn-dev"
remote = true

# Created via `wrangler kv namespace create CLOUDFLARE_RATE_LIMIT_KV --env dev`; replace
# the id below with the value that command prints.
[[env.preview.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "c3fb9b94d2074304986c58049620d0b4"
remote = true

[env.preview.vars]
APP_ENV = "preview"

[observability.logs]
enabled = true
invocation_logs = false

[previews.vars]
APP_ENV = "preview"

[[previews.r2_buckets]]
binding = "CLOUDFLARE_IMAGES"
bucket_name = "karasu-lab-cdn-dev"

[[previews.kv_namespaces]]
binding = "CLOUDFLARE_RATE_LIMIT_KV"
id = "c3fb9b94d2074304986c58049620d0b4"
